# Ephemeral Postgres used by the integration test suite.
# Start: docker compose -f docker/docker-compose.test.yml up -d db-test
services:
  db-test:
    image: postgres:16
    container_name: app-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db_test
    ports:
      - "5433:5432"
