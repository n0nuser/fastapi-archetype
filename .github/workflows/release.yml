name: Release

# Tag-driven releases: bump `version` in pyproject.toml, commit, then push a
# matching SemVer tag (`v1.2.3`). This workflow verifies both match, lints the
# OpenAPI contract, and publishes the GitHub Release with the schema attached.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject.toml version $PYPROJECT_VERSION. Update pyproject.toml and re-tag."
            exit 1
          fi

      - name: Export and lint OpenAPI schema
        run: |
          uv sync --all-groups
          cp src/.env.example src/.env
          uv run python scripts/export_openapi.py
          npx --yes @stoplight/spectral-cli@6.16.3 lint --fail-severity=warn openapi.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: openapi.json
