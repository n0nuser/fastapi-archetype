# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
        # Cookiecutter templates contain raw Jinja and cannot be parsed.
        exclude: ^cookiecutter/
      - id: check-yaml
        exclude: ^cookiecutter/
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        exclude: ^tests/.*data/.*$
      - id: check-json
      - id: name-tests-test
        exclude: ^tests/factories\.py$
        args: [--pytest-test-first]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.4
    hooks:
      # Run the linter (config lives in pyproject.toml).
      - id: ruff
        args: ["--fix"]
        exclude: ^cookiecutter/
      # Run the formatter.
      - id: ruff-format
        exclude: ^cookiecutter/
  # Export the OpenAPI schema from the codebase and lint it with Spectral.
  # Requires Node.js on the PATH (Spectral is an npm tool).
  - repo: local
    hooks:
      - id: openapi-spectral-lint
        name: export OpenAPI schema and lint with Spectral
        entry: bash -c 'uv run python scripts/export_openapi.py && npx --yes @stoplight/spectral-cli@6.16.3 lint --fail-severity=warn openapi.json'
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|scripts/export_openapi\.py|\.spectral\.yaml)$
