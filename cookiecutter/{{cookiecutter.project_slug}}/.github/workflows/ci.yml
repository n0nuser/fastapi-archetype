{% raw %}
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5433/app_db_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups
      - run: cp src/.env.example src/.env
      # Application suite (needs Postgres) plus the CRUD library unit suite.
      - run: >-
          uv run pytest tests libs/fastapi-crud-base/tests
          --cov=src --cov=libs/fastapi-crud-base/src --cov-report=term-missing

  openapi:
    # Exports the OpenAPI schema from the codebase, lints it with Spectral,
    # and publishes it as a build artifact for review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --all-groups
      - run: cp src/.env.example src/.env
      - run: uv run python scripts/export_openapi.py
      - run: npx --yes @stoplight/spectral-cli@6.16.3 lint --fail-severity=warn openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
{% endraw %}
